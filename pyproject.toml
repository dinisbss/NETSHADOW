
[build-system]
requires = [
    "setuptools>=68",
    "setuptools-rust>=1.12",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "netshadow"
version = "1.0.0"
description = "Network Intelligence and Security Auditing Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "NETSHADOW Development Team" }
]
dependencies = [
    "psutil>=5.9.0",
    "PyYAML>=6.0",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
pdf = [
    "reportlab>=4.0"
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2"
]

[project.scripts]
netshadow = "interface.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = [
    "config",
    "core",
    "interface",
    "interface.commands",
    "engines",
    "engines.device_engine",
    "engines.discovery_engine",
    "engines.monitoring_engine",
    "engines.network_engine",
    "engines.port_engine",
    "engines.rust_bridge",
    "engines.security_engine",
    "engines.service_engine",
    "modules",
    "security",
    "database",
    "database.repositories",
    "profiles",
    "monitoring",
    "intelligence",
    "reports"
]
exclude = [
    "tests",
    "data",
    "logs",
    "docs",
    "scripts",
    "dashboard",
    "rust"
]

[[tool.setuptools-rust.ext-modules]]
target = "netshadow_rust"
path = "rust/Cargo.toml"
binding = "PyO3"
optional = true
